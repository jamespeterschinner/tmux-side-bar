set-window-option -g mode-keys vi
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set -g xterm-keys on

set-option -g remain-on-exit off

set -ag terminal-overrides ",$TERM:Tc"

set-option -g pane-base-index 1

set -g pane-border-style fg=colour238
set -g pane-border-status top
set -g pane-border-format '#{pane_id} #{@dependant_pane}'


bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


bind -n m-e run-shell "zsh -f -c 'export EDITOR=helix-opener; export PATH=$HOME/.local/bin:/usr/bin:/bin:/opt/homebrew/bin; tmux-side-bar >>/tmp/tmux-side-bar.log 2>&1'"

set-hook -g after-kill-pane 'run-shell -b ~/.local/bin/kill-orphaned-panes'
set-hook -g pane-died 'run-shell -b ~/.local/bin/kill-orphaned-panes'
set-hook -g pane-exited 'run-shell -b ~/.local/bin/kill-orphaned-panes'

# Resize panes with Alt + Arrow keys
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5


##### Alt + nm,. → Helix-aware (send to Helix if hx, else tmux)
bind -n M-h if-shell -F "#{==:#{pane_current_command},hx}" "send-keys Escape h" "select-pane -L"
bind -n M-j if-shell -F "#{==:#{pane_current_command},hx}" "send-keys Escape j" "select-pane -D"
bind -n M-k if-shell -F "#{==:#{pane_current_command},hx}" "send-keys Escape k" "select-pane -U"
bind -n M-l if-shell -F "#{==:#{pane_current_command},hx}" "send-keys Escape l" "select-pane -R"

# Meta shortcuts for prefix+w and prefix+e
bind -n M-w choose-tree -Zw
bind -n M-z resize-pane -Z
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-b last-window

